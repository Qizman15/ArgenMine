server {
  listen 443 ssl http2; server_name argenmine.net www.argenmine.net; root /var/www/argenmine; index index.html;
  ssl_certificate /etc/ssl/cloudflare/origin.pem; ssl_certificate_key /etc/ssl/cloudflare/origin.key; # Cloudflare Origin Certificate
  add_header X-Content-Type-Options nosniff; add_header X-Frame-Options DENY; add_header Referrer-Policy same-origin;
  location / { try_files $uri $uri/ =404; }
  location = /php/api.php { limit_req zone=auth burst=20 nodelay; include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }
  location = /php/webhook.php { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }
  location ~ ^/php/(config|lib)\.php$ { deny all; }
  location ~ \.sql$ { deny all; }
}
server { listen 80; server_name argenmine.net www.argenmine.net; return 301 https://$host$request_uri; }
