PR.forEach(p=>{p.sv='surv';p.ct='priv'});

<div class="two"><div><h2>✳ Доступные серверы</h2><p class="mut">Выберите сервер, для которого хотите купить товары</p><div class="seg" id="sv">${SERVERS.map(([k,n])=>`<button data-k="${k}" class="${SV===k?'on':''}">${n}</button>`).join('')}</div></div>

<div style="display:flex;justify-content:flex-end;margin-bottom:10px"><select id="cur" style="width:auto" aria-label="Валюта">${Object.entries(CUR).map(([k,v])=>`<option value="${k}" ${L.get('cur','RUB')===k?'selected':''}>${k} — ${v[2]}</option>`).join('')}</select></div>
<div id="sg">${shopGrid()}</div>${recBlock()}${srvBlock()}`;
const P={
"":()=>homePage(),
shop:()=>homePage(),
forum:()=>`<h1>Форум ArgenMine</h1>${forumList()}`,
sec:id=>{const s=SECT.flatMap(x=>x[1]).find(x=>x[0]===id);if(!s)return'<p>Раздел не найден.</p>';const l=topics().filter(t=>t.s===id).reverse();
 return`<h1>${s[1]}</h1><p class="mut">${s[2]}</p>${me()?`<div class="box"><label>Название темы</label><input id="tt" maxlength="80"><label>Текст</label><textarea id="tb" rows="3"></textarea><p><button class="btn" id="mk">Создать тему</button></p></div>`:needLogin()}<h2>Темы</h2><div class="box" style="padding:0">${l.map(t=>`<div class="row"><div class="av">${esc(t.a[0]).toUpperCase()}</div><div class="t"><b>${esc(t.t)}</b><span class="mut">${esc(t.b)}</span></div><span class="tag">${esc(t.a)}</span></div>`).join('')||'<div class="row mut">Тем пока нет. Создайте первую.</div>'}</div>`},
users:()=>`<h1>Пользователи</h1><div class="grid">${users().map(n=>`<div class="box row" style="border:0"><div class="av">${esc(n[0]).toUpperCase()}</div><div class="t"><b>${esc(n)}</b><span class="mut">Игрок · тем: ${topics().filter(t=>t.a===n).length}</span></div></div>`).join('')||'<p class="mut">Пока нет пользователей.</p>'}</div>`,
admin:()=>`<h1>Команда проекта</h1>${STAFF.map(([r,l])=>`<h2>${r}</h2><div class="grid">${l.map(n=>`<div class="box row" style="border:0"><div class="av">${n[0]}</div><div class="t"><b>${n}</b><span class="mut">${r}</span></div></div>`).join('')}</div>`).join('')}`,
rules:()=>`<h1>Правила сервера</h1><div class="box" style="padding:0">${RULES.map(r=>`<div class="row"><span class="tag">Важно</span><div class="t"><b>${r}</b></div></div>`).join('')}</div><p><a href="#/offer" style="color:var(--a)">Публичная оферта магазина</a></p>`,
offer:()=>`<h1>Публичная оферта</h1><p class="mut">Шаблон. Перед запуском приёма платежей проверьте текст с юристом и впишите свои реквизиты.</p><div class="box"><ol>${OFFER.map(o=>`<li style="margin:8px 0">${esc(o)}</li>`).join('')}</ol></div>`,
games:()=>`<h1>Игры</h1><p class="mut">Мини-игры. Управление: стрелки или WASD.</p><div class="tabs" id="gt"><button data-k="snake">Змейка</button><button data-k="memory">Память</button><button data-k="clicker">Кликер</button></div><div class="box" id="gm"></div>`,
friends:()=>{const u=me();if(!u)return needLogin();const f=L.get('fr:'+u,[]);return`<h1>Друзья</h1><div class="box"><label>Найти игрока (минимум 2 символа)</label><div style="display:flex;gap:8px"><input id="fq"><button class="btn" id="fb">Добавить</button></div></div><h2>Список друзей</h2><div class="box" style="padding:0">${f.map(n=>`<div class="row"><div class="av">${esc(n[0]).toUpperCase()}</div><div class="t"><b>${esc(n)}</b></div><button class="btn g" data-d="${esc(n)}">Удалить</button></div>`).join('')||'<div class="row mut">Друзей пока нет.</div>'}</div>`},
ach:()=>{const u=me();if(!u)return needLogin();const d=ACH.filter(a=>a[2](u)).length;return`<h1>Достижения</h1><p class="mut">Открыто ${d} из ${ACH.length}</p><div class="grid">${ACH.map(([n,t,f])=>{const o=f(u);return`<div class="box ach ${o?'on':''}"><b>${n}</b><p class="mut">${t}</p><span class="tag">${o?'Получено':'Закрыто'}</span></div>`}).join('')}</div>`},
chat:()=>`<h1>Общий чат</h1><div class="box"><div class="chat" id="cl">${L.get('chat',[]).map(m=>`<div class="msg"><small>${esc(m.a)}</small><br>${esc(m.m)}</div>`).join('')||'<span class="mut">Сообщений пока нет.</span>'}</div>${me()?`<div style="display:flex;gap:8px"><input id="cm" maxlength="200" placeholder="Сообщение"><button class="btn" id="cs">Отправить</button></div>`:needLogin()}</div>`,
search:()=>`<h1>Поиск</h1><div class="box"><div style="display:flex;gap:8px"><input id="sq" placeholder="Название, текст или пользователь"><button class="btn" id="sb">Найти</button></div></div><div id="sr" style="margin-top:14px"></div>`,
login:()=>`<div class="box form"><h1>С возвращением</h1><label>Ник или e-mail</label><input id="ln" autocomplete="username"><label>Пароль</label><input id="lp" type="password" autocomplete="current-password">${ts()}<p><button class="btn" id="lb">Войти</button></p><p class="mut"><a href="#/forgot" style="color:var(--a)">Забыли пароль?</a> · <a href="#/reg" style="color:var(--a)">Регистрация</a></p></div>`,
reg:()=>`<div class="box form"><h1>Регистрация</h1><label>Ник (3–16 символов, латиница, цифры, _)</label><input id="rn" maxlength="16"><label>E-mail (нужен для восстановления пароля)</label><input id="re" type="email"><label>Пароль (от 6 символов)</label><input id="rp" type="password" autocomplete="new-password">${ts()}<p><button class="btn" id="rb">Создать аккаунт</button></p>${CFG.BACKEND?'':'<p class="mut">Демо: данные хранятся только в вашем браузере.</p>'}</div>`,
forgot:()=>`<div class="box form"><h1>Восстановление пароля</h1><p class="mut">Введите e-mail аккаунта — мы отправим письмо со ссылкой для создания нового пароля.</p><label>E-mail</label><input id="fe" type="email">${ts()}<p><button class="btn" id="fgb">Отправить письмо</button></p><div id="fgm" class="mut"></div></div>`,
reset:t=>`<div class="box form"><h1>Новый пароль</h1><label>Новый пароль (от 6 символов)</label><input id="np" type="password" autocomplete="new-password"><p><button class="btn" id="nb" data-t="${esc(t)}">Сохранить пароль</button></p></div>`};

P.paid=()=>`<div class="box" style="text-align:center;padding:40px"><div style="font-size:56px">✅</div><h1>Спасибо за покупку!</h1><p class="mut">Если оплата прошла, привилегия будет выдана на ваш ник в течение минуты. Зайдите на сервер ${CFG.IP}.</p><a class="btn" href="#/shop">Вернуться в магазин</a></div>`;
P.balance=()=>!me()?needLogin():`<h1>Пополнение баланса</h1><p class="mut">Баланс можно тратить на любые товары магазина. Зачисление происходит автоматически после оплаты.</p><div class="box form"><p>Ваш баланс: <b>${fmt(bal())}</b></p><label>Сумма пополнения, ₽</label><input id="ta" type="number" min="10" max="50000" value="300"><div class="tabs" style="margin:10px 0">${[100,300,500,1000,2000].map(v=>`<button data-q="${v}">${v} ₽</button>`).join('')}</div><p class="mut" id="tu"></p><p><button class="btn" id="tb">Пополнить</button></p>${CFG.BACKEND?'':'<p class="mut" style="font-size:12px">Демо: баланс пополняется без оплаты.</p>'}</div>`;
function initBal(){const i=$('#ta');if(!i)return;const upd=()=>{const v=+i.value||0;$('#tu').textContent=v>0?'К оплате картой: '+Math.round(v*CUR.UAH[0])+' ₴ (LiqPay, курс сайта)':''};
 i.oninput=upd;upd();document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{i.value=b.dataset.q;upd()});
 $('#tb').onclick=async()=>{const v=Math.round(+i.value);if(!(v>=10&&v<=50000))return toast('Сумма от 10 до 50 000 ₽');
  if(!CFG.BACKEND){setBal(bal()+v);toast('Демо: баланс пополнен без оплаты');route();return}
  try{submitPay(await api('topup',{amount:v}))}catch(x){toast(x.message)}}}
const RL={player:'Игрок',moderator:'Модератор',admin:'Администратор',main_admin:'Главный администратор',creator:'Создатель'},ST={pending:'Ожидает оплаты',paid:'Оплачен',delivered:'Выдан',failed:'Ошибка'};
const roleOf=n=>CFG.BACKEND?L.get('role',''):(L.get('roles',{})[n]||(n==='Qizman'?'creator':n==='FOGR'?'main_admin':'player'));
const isAdm=()=>!!me()&&['creator','main_admin'].includes(roleOf(me()));
const SEED=[];
const ord=()=>L.get('ord',SEED);
const A={
 async stats(){if(CFG.BACKEND)return api('admin_stats');const o=ord().filter(x=>['paid','delivered'].includes(x.status));return{users:users().length,orders:ord().length,revenue:o.reduce((a,x)=>a+x.amount,0),topics:topics().length,msgs:L.get('chat',[]).length}},
 async orders(){return CFG.BACKEND?api('admin_orders'):ord()},
 async setOrder(id,st){if(CFG.BACKEND)return api('admin_order_status',{id,status:st});L.set('ord',ord().map(x=>x.id==id?{...x,status:st}:x))},
 async redeliver(id){if(CFG.BACKEND)return api('admin_redeliver',{id});toast('Демо: на сервере команда уйдёт через RCON')},
 async prods(){return CFG.BACKEND?api('admin_products'):PR.map(p=>({id:p.id,name:p.n,price:p.p,active:!p.off}))},
 async saveProd(id,price,active){if(!(price>0))throw new Error('Цена должна быть больше 0');if(CFG.BACKEND)await api('admin_product_save',{id,price,active});else{const o=L.get('pov',{});o[id]={price,off:!active};L.set('pov',o)}const p=PR.find(x=>x.id===id);p.p=price;p.off=!active},
 async usersL(){return CFG.BACKEND?api('admin_users'):L.get('users',[]).map(u=>({nick:u.n,email:u.e,role:roleOf(u.n),balance:(L.get('balances',{})[u.n]||0)}))},
 async setRole(nick,role){if(CFG.BACKEND)return api('admin_user_role',{nick,role});L.set('roles',{...L.get('roles',{}),[nick]:role})},
 async delUser(nick){if(CFG.BACKEND)return api('admin_user_delete',{nick});L.set('users',L.get('users',[]).filter(u=>u.n!==nick))},
 async addBal(nick,d){if(CFG.BACKEND)return api('admin_user_balance',{nick,delta:d});const b=L.get('balances',{});b[nick]=Math.max(0,(b[nick]||0)+d);L.set('balances',b)},
 async promos(){return CFG.BACKEND?api('admin_promos'):Object.entries(L.get('promos',PROMO)).map(([code,percent])=>({code,percent}))},
 async savePromo(code,percent){if(CFG.BACKEND)return api('admin_promo_save',{code,percent});L.set('promos',{...L.get('promos',PROMO),[code]:percent})},
 async delPromo(code){if(CFG.BACKEND)return api('admin_promo_delete',{code});const o={...L.get('promos',PROMO)};delete o[code];L.set('promos',o)},
 async topicsL(){return CFG.BACKEND?api('admin_topics'):topics().map((t,i)=>({id:i,title:t.t,nick:t.a}))},
 async delTopic(id){if(CFG.BACKEND)return api('admin_topic_delete',{id});L.set('topics',topics().filter((_,i)=>i!=id))},
 async chatL(){return CFG.BACKEND?api('admin_chat'):L.get('chat',[]).map((m,i)=>({id:i,msg:m.m,nick:m.a}))},
 async delMsg(id){if(CFG.BACKEND)return api('admin_chat_delete',{id});L.set('chat',L.get('chat',[]).filter((_,i)=>i!=id))}};
P.panel=()=>!isAdm()?`<div class="box">Доступ только для создателя и главного администратора.</div>${me()?'':needLogin()}`:`<h1>Админ-панель</h1>${CFG.BACKEND?'':'<p class="mut">Демо: данные хранятся в вашем браузере. На сервере доступ проверяется по роли в базе данных.</p>'}<div class="tabs" id="pt">${[['ov','Обзор'],['or','Заказы'],['pr','Товары'],['us','Пользователи'],['pm','Промокоды'],['md','Модерация']].map(([k,n])=>`<button data-t="${k}">${n}</button>`).join('')}</div><div id="pb"></div>`;
async function initPanel(){const pb=$('#pb'),tabs=document.querySelectorAll('#pt button'),money=n=>Number(n).toLocaleString('ru-RU')+' ₽';
 const sel=(o,v,at)=>`<select ${at} style="width:auto">${o.map(([k,n])=>`<option value="${k}" ${k===v?'selected':''}>${n}</option>`).join('')}</select>`;
 const list=h=>`<div class="box" style="padding:0">${h||'<div class="row mut">Пока пусто.</div>'}</div>`;
 async function show(t){tabs.forEach(b=>b.classList.toggle('on',b.dataset.t===t));pb.innerHTML='<p class="mut">Загрузка…</p>';
  try{let h='';
   if(t==='ov'){const s=await A.stats(),o=(await A.orders()).slice(0,5);h=`<div class="stats">${[['Пользователей',s.users],['Заказов',s.orders],['Выручка',money(s.revenue)],['Тем на форуме',s.topics],['Сообщений в чате',s.msgs]].map(([n,v])=>`<div class="box"><b>${v}</b><span class="mut">${n}</span></div>`).join('')}</div><h2>Последние заказы</h2>${list(o.map(x=>`<div class="row"><div class="t"><b>${esc(x.nick)} · ${esc(x.product)}</b><span class="mut">${esc(x.created)}</span></div><span class="tag">${ST[x.status]}</span><b>${money(x.amount)}</b></div>`).join(''))}`}
   else if(t==='or'){const o=await A.orders();h=list(o.map(x=>`<div class="row"><div class="t"><b>#${x.id} ${esc(x.nick)} · ${esc(x.product)}</b><span class="mut">${esc(x.created)} · ${esc(x.method||'')}</span></div><b>${money(x.amount)}</b>${sel(Object.entries(ST),x.status,`data-a="so" data-id="${x.id}"`)}${x.status==='paid'?`<button class="btn g" data-a="rd" data-id="${x.id}">Выдать</button>`:''}</div>`).join(''))}
   else if(t==='pr'){const p=await A.prods();h=list(p.map(x=>`<div class="row"><div class="t"><b>${esc(x.name)}</b></div><input data-f="price" type="number" min="1" value="${x.price}" style="width:110px"><label class="ck" style="margin:0"><input type="checkbox" data-f="act" ${+x.active?'checked':''}> в продаже</label><button class="btn" data-a="sp" data-id="${esc(x.id)}">Сохранить</button></div>`).join(''))+'<p class="mut">Цена в рублях. Команды выдачи редактируются в таблице products базы данных.</p>'}
   else if(t==='us'){const u=await A.usersL();h=list(u.map(x=>`<div class="row"><div class="av">${esc(x.nick[0]).toUpperCase()}</div><div class="t"><b>${esc(x.nick)}</b><span class="mut">${esc(x.email||'')}</span></div><span class="tag">${money(x.balance||0)}</span><button class="btn g" data-a="bl" data-id="${esc(x.nick)}">±</button>${sel(Object.entries(RL),x.role,`data-a="sr" data-id="${esc(x.nick)}"`)}${x.nick!==me()?`<button class="btn g" data-a="du" data-id="${esc(x.nick)}">Удалить</button>`:''}</div>`).join(''))}
   else if(t==='pm'){const p=await A.promos();h=`<div class="box" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px"><input id="pc" placeholder="КОД" style="max-width:200px"><input id="pp" type="number" min="1" max="90" placeholder="Скидка %" style="max-width:130px"><button class="btn" data-a="ap">Добавить</button></div>`+list(p.map(x=>`<div class="row"><div class="t"><b>${esc(x.code)}</b></div><span class="tag">−${x.percent}%</span><button class="btn g" data-a="dp" data-id="${esc(x.code)}">Удалить</button></div>`).join(''))}
   else{const[tp,ch]=await Promise.all([A.topicsL(),A.chatL()]);h=`<h2>Темы форума</h2>`+list(tp.map(x=>`<div class="row"><div class="t"><b>${esc(x.title)}</b><span class="mut">${esc(x.nick)}</span></div><button class="btn g" data-a="dt" data-id="${x.id}">Удалить</button></div>`).join(''))+`<h2>Чат</h2>`+list(ch.map(x=>`<div class="row"><div class="t"><b>${esc(x.nick)}</b><span class="mut">${esc(x.msg)}</span></div><button class="btn g" data-a="dm" data-id="${x.id}">Удалить</button></div>`).join(''))}
   pb.innerHTML=h}catch(e){pb.innerHTML='<div class="box">'+esc(e.message)+'</div>'}}
 pb.onclick=async e=>{const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.a,id=b.dataset.id;
