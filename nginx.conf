server {
  listen 80; server_name argenmine.net www.argenmine.net; root /var/www/argenmine; index index.html;
  include /etc/nginx/cloudflare.conf;
  add_header X-Frame-Options SAMEORIGIN; add_header X-Content-Type-Options nosniff;
  location / { try_files $uri $uri/ =404; }
  location = /php/api.php { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }
  location = /php/liqpay.php { include snippets/fastcgi-php.conf; fastcgi_pass unix:/run/php/php8.3-fpm.sock; }
  location ~ ^/(php/config\.php|sql/|docs/) { deny all; }
}
